{% extends "base.html" %}

{% block title %}Contraseña actualizada · VetCare Central{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="feature-icon bg-soft-green mx-auto mb-3">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h1 class="h4 fw-bold">Contraseña actualizada</h1>
                    <p class="text-secondary">
                        Tu contraseña fue cambiada correctamente. La sesión actual se mantiene activa.
                    </p>
                    <a href="{% url 'usuarios:perfil' %}" class="btn btn-vet">
                        <i class="bi bi-person-gear me-1"></i>Volver a mi perfil
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

<div class="mb-3">
    <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">
        {{ campo.label }}
        {% if campo.field.required %}<span class="text-danger" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ campo }}
    {% if campo.help_text %}
    <div class="form-text">{{ campo.help_text|safe }}</div>
    {% endif %}
    {% for error in campo.errors %}
    <div class="invalid-feedback d-block">
        <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
    </div>
    {% endfor %}
</div>
